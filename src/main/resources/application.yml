server:
  port: 8081

spring:
  application:
    name: asset-tracker-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/assetdb
    username: assetuser
    password: assetpass
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    base-on-migrate: true
    logging:
      level:
        org.flywaydb: DEBUG

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgYXNzZXQgdHJhY2tlciBiYWNrZW5k}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pricing:
  update-interval-ms: ${PRICING_INTERVAL_MS:300000}
  coingecko:
    base-url: https://api.coingecko.com/api/v3
  yahoo:
    base-url: https://query1.finance.yahoo.com
  maybank-gold:
    url: https://www.maybank2u.com.my/maybank2u/malaysia/en/personal/rates/gold.page

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

